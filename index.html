eElement('script');script.src='https://s3.tradingview.com/external-embedding/embed-widget-advanced-chart.js';script.type='text/javascript';script.async=true;script.text=JSON.stringify({autosize:true,symbol:asset.tv,interval:'D',timezone:'Asia/Singapore',theme:'light',style:'1',locale:'kr',allow_symbol_change:true,hide_side_toolbar:false,hide_volume:false,withdateranges:true,details:true,calendar:false,support_host:'https://www.tradingview.com'});root.querySelector('.tradingview-widget-container').appendChild(script)}
